# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - D-D4eCharacterCreator

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Which part of the version to bump (manual trigger only — overrides commit tags)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip this workflow if the commit was an auto-version bump
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write #Required for pushing version bump commit

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Decide whether to bump major / minor / patch / none.
      # Priority:
      #   1. workflow_dispatch input (manual trigger from the Actions tab)
      #   2. tag anywhere in the pushed commit messages or the PR title:
      #      [major], [minor], [patch], or [none]
      #   3. default: patch
      - name: Determine version bump type
        id: vbump
        # IMPORTANT: pass commit messages via env, NOT via ${{ }} interpolation.
        # Direct interpolation injects the message as bash source code — multi-line
        # bodies with parens/brackets/quotes get parsed by the shell and break the
        # script (e.g. exit 126 "File name too long"). With env: the value is read
        # at runtime via the variable and bash never re-parses its contents.
        #
        # Why BOTH head_commit and commits: on a PR merge, head_commit is the merge
        # commit — "Merge pull request #N from <branch>", whose body is the PR title.
        # A tag written in the BRANCH commit isn't in there at all; it's in
        # github.event.commits. Searching only head_commit meant every merged PR
        # silently fell through to the `patch` default, which is why a CI-only PR
        # tagged [none] still bumped the version. toJSON (not join) so the
        # expression can't fail when commits is absent, e.g. on workflow_dispatch.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ALL_COMMIT_MSGS: ${{ toJSON(github.event.commits.*.message) }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          # Merge commit / PR title + every commit in the push
          SEARCH_TEXT="${COMMIT_MSG}
          ${ALL_COMMIT_MSGS}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUMP="$DISPATCH_BUMP"
            SOURCE="workflow_dispatch input"
          else
            if echo "$SEARCH_TEXT" | grep -qE '\[major\]'; then
              BUMP=major
              SOURCE="[major] tag in pushed commit messages"
            elif echo "$SEARCH_TEXT" | grep -qE '\[minor\]'; then
              BUMP=minor
              SOURCE="[minor] tag in pushed commit messages"
            elif echo "$SEARCH_TEXT" | grep -qE '\[none\]'; then
              BUMP=none
              SOURCE="[none] tag in pushed commit messages (skipping version bump)"
            elif echo "$SEARCH_TEXT" | grep -qE '\[patch\]'; then
              BUMP=patch
              SOURCE="[patch] tag in pushed commit messages"
            else
              BUMP=patch
              SOURCE="default (no tag found)"
            fi
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Selected version bump: $BUMP (source: $SOURCE)"
          # Echo what was actually searched — without this, a missed tag looks
          # identical to no tag, which is exactly how the bug above went unnoticed.
          echo "--- searched text (first 20 lines) ---"
          echo "$SEARCH_TEXT" | head -20

      - name: Bump version
        if: steps.vbump.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(npm version ${{ steps.vbump.outputs.bump }} --no-git-tag-version)
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
        env:
          VITE_SUPABASE_URL: https://flzldgzbrafgdgioinfk.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsemxkZ3picmFmZ2RnaW9pbmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMjQwODEsImV4cCI6MjA4OTcwMDA4MX0.0yHtH9qTMHpLgzIXu-JVFAF4XPBLwMeRbWe9OHxM6fI

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_65BEDE69D6D940F1860F7006B09AC63E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E2B94D135C9949579C5D74FBCC628781 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5E115FEAA63F4E3E81FFE4944D3DE8E1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'D-D4eCharacterCreator'
          slot-name: 'Production'
          package: .
